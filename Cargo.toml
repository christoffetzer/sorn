[package]
name = "sorn"
version = "0.1.0"
edition = "2024"
authors = ["Christof Fetzer"]
license = "MIT OR Apache-2.0"
keywords = ["error", "random", "number", "generator"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
repository = "https://github.com/christoffetzer/sorn.git"
homepage = "https://tu-dresden.de/ing/informatik/sya/se/studium/lehrveranstaltungen/summer-semester/PROG/index"
description = "soorn is a CLI tool to generate <REPEAT> random strings each consisting of <COMPONENTS> random strings each of length <LENGTH> each and separated by `-`. Between the output of two random strings, the program sleeps for <SLEEP> seconds. The program will print the output in double quotes unless the --raw option is set."

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.9.1"
